<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-home" title="Home">
      <!-- House icon (SVG) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Home</span>
    </a>
    <span class="nav-title">My Website</span>
  </nav>

  <!-- Main Layout -->
  <div class="layout">

    <!-- Home Page Content -->
    <main class="main-content" id="home">
      <h1>Welcome Home!</h1>
      <p>This is the home page. Use the sidebar on the right to explore Apps and Games.</p>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar">

      <!-- Phone / Apps Icon -->
      <button class="sidebar-btn" id="appsBtn" title="Apps">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M17 1.01L7 1C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
        </svg>
        <span>Apps</span>
      </button>

      <!-- Controller / Games Icon -->
      <button class="sidebar-btn" id="gamesBtn" title="Games">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M21.58 16.09l-1.09-7.66C20.21 6.46 18.52 5 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66C2.2 17.63 3.39 19 4.94 19c.68 0 1.32-.27 1.8-.75L9 16h6l2.25 2.25c.48.48 1.13.75 1.8.75 1.56 0 2.75-1.37 2.53-2.91zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4 1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2-3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
        </svg>
        <span>Games</span>
      </button>

    </aside>
  </div>

  <!-- Slide-in Panel -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panelTitle">Panel</span>
      <button class="panel-close" id="panelCloseBtn">&times;</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
  <div class="overlay" id="overlay"></div>

  <script src="script.js"></script>
</body>
</html>
